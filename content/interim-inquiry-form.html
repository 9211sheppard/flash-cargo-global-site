<form class="contact-form" data-request-form data-audience="buyer_sourcing" method="post" action="https://flash-cargo-form.old-sun-35f9.workers.dev/contact-request" aria-label="Buyer sourcing request"><input type="hidden" name="form_version" value="2"><input type="hidden" name="request_type" value="buyer_sourcing"><input type="hidden" name="form_started_at" value=""><input type="hidden" name="javascript_enabled" value="no"><label class="hidden-field" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><label class="wide">Reply email (private)<span class="field-note">Used to respond to this request. Not displayed publicly.</span><input name="email" required type="email" maxlength="254"></label><label class="wide">Company (optional)<input name="company_name" type="text" maxlength="300"></label><fieldset class="sourcing-fields wide" data-sourcing-fields><legend>What would you like to source?</legend><label class="wide">Product<input name="product_name" required type="text" maxlength="160"></label><label>Quantity<input name="quantity" required type="number" maxlength="300" min="0.001" step="any" inputmode="decimal"></label><label>Unit<select name="quantity_unit" required><option value="pieces">Pieces</option><option value="cartons">Cartons</option><option value="kg">Kg</option><option value="tonnes">Tonnes</option></select></label><label>Target price (optional)<input name="target_price" type="number" maxlength="300" min="0.001" step="any" inputmode="decimal"></label><label>Price basis<select name="price_basis"><option value="per_unit">Per unit</option><option value="total_order">Total order</option></select></label><label>Currency<select name="target_price_currency"><option value="USD">USD</option><option value="CAD">CAD</option></select></label><label>Preferred supplier country (optional)<input name="origin_preference" type="text" maxlength="100"></label><label>Destination country<input name="delivery_country" required type="text" maxlength="100"></label><label>Destination city<input name="delivery_city" required type="text" maxlength="120"></label><label>Province or state (if applicable)<input name="delivery_region" type="text" maxlength="100"></label><label>Postal code (if applicable)<input name="delivery_postal_code" type="text" maxlength="24"></label><label class="wide">Timeline<span class="field-note">Required date or a flexible time window.</span><input name="timeline" required type="text" maxlength="160"></label><label class="wide">Specifications<span class="field-note">Describe the requirements or provide a photo/specification link below.</span><textarea name="product_specs" rows="4" maxlength="3000"></textarea></label><label class="wide">Photo or specification link<span class="field-note">A web link is enough; do not share confidential or unrelated files.</span><input name="spec_link" type="url" maxlength="600"></label></fieldset><p class="field-note wide">We reply within one business day. A request is not an order or payment authorization. <a href="/privacy-policy/">Privacy</a></p><button class="button primary wide" type="submit">Start a sourcing request <span aria-hidden="true">&#8599;</span></button></form>
