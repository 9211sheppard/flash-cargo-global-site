<form action="https://flash-cargo-form.old-sun-35f9.workers.dev/contact-request" aria-describedby="request-service-note" class="contact-form" data-inquiry-form="" method="post">
<fieldset class="inquiry-kind wide">
<legend>What do you need?</legend>
<div class="inquiry-choices">
<label><input checked="" name="inquiry_type" type="radio" value="sourcing"/>Source a product for me</label><label><input name="inquiry_type" type="radio" value="freight"/>Ship my freight</label>
</div>
</fieldset>
<label aria-hidden="true" class="hidden-field">Website<input autocomplete="off" name="website" tabindex="-1"/></label>
<input name="form_started_at" type="hidden" value=""/>
<input data-sourcing-summary="" disabled="" name="freight_needs" type="hidden"/>
<label>Full Name<input autocomplete="name" name="full_name" required=""/></label>
<label>Company Name<input autocomplete="organization" name="company_name" required=""/></label>
<label>Email<input autocomplete="email" name="email" required="" type="email"/></label>
<label>Phone<input autocomplete="tel" name="phone" required="" type="tel"/></label>
<label class="wide" data-freight-fields="">Freight Needs<textarea name="freight_needs" placeholder="Tell us the route, cargo type, timing, handling needs, and any document or receiver context already available." required="" rows="6"></textarea></label>
<fieldset class="sourcing-fields wide" data-sourcing-fields="" disabled="" hidden="">
<legend>Product sourcing details</legend>
<label class="wide">Product name<input maxlength="160" name="product_name" required=""/></label>
<label>Quantity<input inputmode="decimal" min="1" name="quantity" required="" step="1" type="number"/></label>
<label>Unit<select name="quantity_unit" required="">
<option value="pieces">Pieces</option>
<option value="cartons">Cartons</option>
<option value="kg">Kg</option>
<option value="tonnes">Tonnes</option>
</select></label>
<label class="wide">Specs<textarea maxlength="1400" name="product_specs" required="" rows="4"></textarea></label>
<label class="wide">Link to a photo or spec sheet <span class="field-note">Optional</span><input maxlength="500" name="spec_link" pattern="https?://.+" placeholder="https://" type="url"/></label>
<label>Target price <span class="field-note">Optional</span><input inputmode="decimal" min="0.000001" name="target_price" step="any" type="number"/></label>
<label>Price basis<select name="price_basis">
<option value="per_unit">Per unit</option>
<option value="total_order">Total order</option>
</select></label>
<label>Currency<select name="target_price_currency"><option value="USD">USD</option><option value="CAD">CAD</option></select></label>
<label>Delivery city<input autocomplete="shipping address-level2" maxlength="120" name="delivery_city" required=""/></label>
<label>Province or state<input autocomplete="address-level1" maxlength="100" name="delivery_region" required=""/></label><label>Delivery country<input autocomplete="shipping country-name" maxlength="120" name="delivery_country" required=""/></label>
<label class="wide">Postal code <span class="field-note">If applicable</span><input autocomplete="shipping postal-code" maxlength="24" name="delivery_postal_code"/></label>
</fieldset>
<button class="button primary wide" type="submit">Submit Request</button>
</form>
